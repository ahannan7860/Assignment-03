
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment-03</title>
</head>
    <style>
        * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
            }

        body {
            font-family: Arial, sans-serif;
            background-color: white;
        }


        header {
            background-color: lightgray;
            height: 55px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

    
        .maindiv {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin-top: 90px;
        }

        .box {
            width: 83px;
            height: 83px;
            border: 1px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            color: black;
        }


        .greeting {
            display: flex;
            justify-content: center;
            margin-top: 120px;
            margin-left: 20px;
        }

        /* input {
            width: 174px;
            height: 32px;
            padding: 5px;
            font-size: 14px;
        } */

        button {
            width: 90px;
            height: 40px;
            border: 1px solid green;
            font-size: 14px;
            cursor: default;
            color: green;
        }
    </style>
</head>
<body>

    <header id="header">
        <h1>Hello</h1>
    </header>

    <div class="maindiv">
        <div class="box" id="red">Red</div>
        <div class="box" id="blue">Blue</div>
        <div class="box" id="green">Green</div>
        <div class="box" id="yellow">Yellow</div>
    </div>

    <div class="greeting">
        <input type="text" placeholder="Enter your name" id="name">
        <button id="btn">Greet</button>
    </div>

    <script>
        document.getElementById("red").onclick=function(){
            document.getElementById("red").style.backgroundColor="red"
        }
        document.getElementById("blue").onclick=function(){
            document.getElementById("blue").style.backgroundColor="blue"
        }
        document.getElementById("green").onclick=function(){
            document.getElementById("green").style.backgroundColor="green"
        }
        document.getElementById("yellow").onclick=function(){
            document.getElementById("yellow").style.backgroundColor="yellow"
        }

        document.getElementById("btn").onclick = function(){
           let val1="" ;
           val1 = document.getElementById("name").value;
           document.getElementById("header").innerHTML= "Hello"+" " + val1
        }
    </script>
</body>
</html>
